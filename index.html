<!DOCTYPE html>
<html lang="es" data-tema="claro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Marcadores: organiza, busca y accede rapidamente a tus enlaces favoritos.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f6f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="icon/marcadores.png" type="image/x-icon">
    <title>Marcadores · Tus enlaces, organizados</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script>
        /* Resuelve el tema antes del primer pintado para evitar el parpadeo */
        (function () {
            var tema = "claro";
            try {
                var guardado = localStorage.getItem("marcadores-tema");
                if (guardado === "claro" || guardado === "oscuro") {
                    tema = guardado;
                } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    tema = "oscuro";
                }
            } catch (error) {
                /* Almacenamiento no disponible: se mantiene el tema claro */
            }
            document.documentElement.setAttribute("data-tema", tema);
        })();
    </script>
</head>

<body>
    <div class="envoltura-global">
        <div class="contenedor-aplicacion">

            <!-- Panel lateral de categorías -->
            <aside class="panel-lateral" id="panelCategorias">
                <div class="cabecera-panel">
                    <img src="icon/marcadores.png" alt="" class="logo-panel" width="36" height="36">
                    <div class="cabecera-panel-texto">
                        <h1 class="titulo-panel">Marcadores</h1>
                        <span class="subtitulo-panel" id="subtituloPanel"></span>
                    </div>
                    <button class="boton-cerrar-panel" id="botonCerrarPanel" aria-label="Cerrar categorías">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <nav class="panel-lateral-nav" aria-label="Categorías">
                    <span class="etiqueta-panel" aria-hidden="true">Categorías</span>
                    <!-- Los botones de categoría se generan mediante javascript -->
                    <div class="panel-lateral-fijo" id="listaCategorias"></div>
                </nav>

                <div class="pie-panel" id="piePanel"></div>
            </aside>

            <!-- Overlay para dispositivos móviles -->
            <div class="overlay-movil" id="overlayMovil"></div>

            <!-- Cabecera móvil -->
            <div class="barra-movil">
                <button class="boton-menu-movil" id="botonMenuMovil" aria-label="Abrir categorías"
                    aria-expanded="false" aria-controls="panelCategorias">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span class="titulo-movil" id="tituloMovil">Marcadores</span>
            </div>

            <!-- Área principal -->
            <div class="contenido-derecho">
                <header class="barra-seccion">
                    <div class="bloque-titulo">
                        <h2 class="titulo-seccion" id="tituloSeccion">Marcadores</h2>
                    </div>

                    <div class="barra-herramientas">
                        <div class="campo-busqueda-seccion" id="campoBusqueda">
                            <svg class="icono-busqueda-seccion" xmlns="http://www.w3.org/2000/svg" width="16"
                                height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="buscadorSeccion" class="input-busqueda-seccion"
                                placeholder="Buscar en esta categoría..." aria-label="Buscar enlaces en la categoría actual"
                                autocomplete="off" autocapitalize="off" spellcheck="false">
                            <button class="boton-limpiar-busqueda" id="botonLimpiarBusqueda"
                                aria-label="Limpiar búsqueda" hidden>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                            <kbd class="atajo-busqueda" aria-hidden="true">/</kbd>
                        </div>

                        <span class="contador-seccion" id="contadorSeccion" role="status" aria-live="polite"></span>

                        <button class="boton-tema-icono" id="botonCambiarTema" aria-label="Cambiar a tema oscuro">
                            <svg class="icono-tema icono-tema-luna" xmlns="http://www.w3.org/2000/svg" width="18"
                                height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                            <svg class="icono-tema icono-tema-sol" xmlns="http://www.w3.org/2000/svg" width="18"
                                height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="4"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                        </button>
                    </div>
                </header>

                <main class="area-principal" id="areaEnlaces">
                    <!-- Las tarjetas se generan mediante javascript -->

                    <div class="estado-vacio" id="estadoVacio">
                        <span class="estado-vacio-icono">
                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </span>
                        <p class="texto-vacio" id="textoVacio">No se encontraron resultados</p>
                        <p class="texto-vacio-detalle" id="detalleVacio">Prueba con otros términos de búsqueda.</p>
                        <button class="boton-vacio" id="botonVaciarBusqueda" hidden>Limpiar búsqueda</button>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- Script de lógica -->
    <script src="js/script.js" defer></script>
</body>

</html>
