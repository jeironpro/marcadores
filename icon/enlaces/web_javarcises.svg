<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Javarcises</title>
  <!-- Fondo: ficha redondeada en acento latón (token del tema Lumen) -->
  <rect width="64" height="64" rx="14" fill="#b45000"/>
  <!-- Vapor de la taza -->
  <path d="M21 11c-2.6 3-2.6 5.6 0 8.6" fill="none" stroke="#fdf9f6" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M43 11c-2.6 3-2.6 5.6 0 8.6" fill="none" stroke="#fdf9f6" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Cuerpo de la taza -->
  <path d="M16 27h32v11a10 10 0 0 1-10 10H26a10 10 0 0 1-10-10z" fill="#fdf9f6"/>
  <!-- Asa de la taza -->
  <path d="M48 29h4a5 5 0 0 1 0 10h-4" fill="none" stroke="#fdf9f6" stroke-width="4" stroke-linecap="round"/>
  <!-- Plato (acento claro del tema) -->
  <rect x="18" y="51" width="28" height="3.5" rx="1.75" fill="#ffc894"/>
</svg>
